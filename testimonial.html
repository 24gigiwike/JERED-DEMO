<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request A Quote</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #0f172a;
  color: #fff;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.subtitle {
  color: #94a3b8;
  margin-bottom: 30px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.form {
  margin-top: 30px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: #fff;
  cursor: pointer;
}

.hidden { display: none; }

.success {
  text-align: center;
  margin-top: 40px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Request A Quote</h1>
  <p class="subtitle">Select A Service And Tell Us About Your Project</p>

  <div id="step1" class="cards">
    <div class="card" onclick="selectFlow('developers')">Developers</div>
    <div class="card" onclick="selectFlow('fitouts')">Corporate & Retail Fit-Outs</div>
    <div class="card" onclick="selectFlow('training')">Training</div>
  </div>

  <div id="formSection" class="form hidden"></div>

  <div id="success" class="success hidden">
    <h2>✔ Request Submitted</h2>
    <p>We Will Contact You Shortly</p>
  </div>
</div>

<script>
let flow = "";

function selectFlow(type) {
  flow = type;
  document.getElementById("step1").classList.add("hidden");
  loadForm();
}

function loadForm() {
  const form = document.getElementById("formSection");
  form.classList.remove("hidden");

  if (flow === "developers" || flow === "fitouts") {
    form.innerHTML = `
      <h3>Project Details</h3>
      <input placeholder="Full Name">
      <input placeholder="Phone Number">
      <input placeholder="Email Address">
      <input placeholder="Project Location">
      <textarea placeholder="Describe Your Project"></textarea>
      <button onclick="submitForm()">Submit</button>
      <button onclick="whatsapp()">Continue With WhatsApp</button>
    `;
  }

  if (flow === "training") {
    form.innerHTML = `
      <h3>Become A Professional Technician</h3>
      <input placeholder="Full Name">
      <input placeholder="Phone Number">
      <input placeholder="Email Address">
      <input placeholder="Location">
      <select>
        <option>Area Of Interest</option>
        <option>Dry Wall</option>
        <option>Ceiling</option>
        <option>Glass Installation</option>
        <option>General Fit-Out</option>
      </select>
      <button onclick="submitForm()">Apply</button>
    `;
  }
}

function submitForm() {
  document.getElementById("formSection").classList.add("hidden");
  document.getElementById("success").classList.remove("hidden");
}

function whatsapp() {
  window.open("https://wa.me/234XXXXXXXXXX");
}
</script>

</body>
</html>
